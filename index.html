<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Marketing cold-open document (#832). App/auth SPA lives in app.html. -->
    <!-- Crawlers (e.g. Facebook/Instagram) often do not run JS; keep in sync with `src/shared/config/seo.js`, `og-home-html.mjs`, and `LandingSeo.jsx`. -->
    <meta property="og:site_name" content="Setlist Pick 'Em" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Setlist Pick'em | The Ultimate Live Music Prediction Game" />
    <meta
      property="og:description"
      content="Setlist Pick 'Em is a free live setlist prediction game built for Phish fans—and more bands soon. Lock openers, closers, encore, and a wildcard before each show; scores update live as songs are played. Tour insights refresh every night the band plays live. Play to unlock personal stats and compete with friends."
    />
    <meta property="og:url" content="https://www.setlistpickem.com/" />
    <meta property="og:image" content="https://www.setlistpickem.com/branding/og-card-1200x630.jpg?v=20260711" />
    <meta property="og:image:secure_url" content="https://www.setlistpickem.com/branding/og-card-1200x630.jpg?v=20260711" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Setlist Pick 'Em — live setlist prediction game" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Setlist Pick'em | The Ultimate Live Music Prediction Game" />
    <meta
      name="twitter:description"
      content="Setlist Pick 'Em is a free live setlist prediction game built for Phish fans—and more bands soon. Lock openers, closers, encore, and a wildcard before each show; scores update live as songs are played. Tour insights refresh every night the band plays live. Play to unlock personal stats and compete with friends."
    />
    <meta name="twitter:image" content="https://www.setlistpickem.com/branding/og-card-1200x630.jpg?v=20260711" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- #662: PNG/ICO only — the old SVG icon was an 854 KB embedded-raster
         wrapper (no vector benefit) that icon-preferring browsers downloaded
         on every cold visit. 96x96 PNG satisfies Google SERP (square, ≥48px). -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png?v=20260715" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon/favicon.ico?v=20260715" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png?v=20260715" />
    <meta name="apple-mobile-web-app-title" content="Setlist Picks" />
    <link rel="manifest" href="/favicon/site.webmanifest?v=20260715" />
    <link rel="canonical" href="https://www.setlistpickem.com/" />
    <meta
      name="description"
      content="Setlist Pick 'Em is a free live setlist prediction game built for Phish fans—and more bands soon. Lock openers, closers, encore, and a wildcard before each show; scores update live as songs are played. Tour insights refresh every night the band plays live. Play to unlock personal stats and compete with friends."
    />
    <meta name="author" content="Road2 Media LLC" />
    <!-- Space Grotesk only: Inter (~344KB variable) loads via @font-face +
         font-display:swap so it does not contend with entry JS on cold opens.
         Early @font-face required so the preload is actually applied (Safari).
         Keep in sync with scripts/space-grotesk-font-face.mjs and src/index.css. -->
    <link rel="preload" href="/fonts/space-grotesk/SpaceGrotesk-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("/fonts/space-grotesk/SpaceGrotesk-VariableFont_wght.woff2") format("woff2");
        font-weight: 300 700;
        font-style: normal;
        font-display: swap;
      }
      html {
        font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      }
    </style>
    <title>Setlist Pick'em | The Ultimate Live Music Prediction Game</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/marketingMain.jsx"></script>
  </body>
</html>
